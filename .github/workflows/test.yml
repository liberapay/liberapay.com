name: CI
on:
  # Trigger the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo sh -c "gpg --dearmor >/etc/apt/keyrings/pgdg.gpg"
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo install -d -m755 -o postgres -g postgres /etc/postgresql/16/main
          sudo install -d -m755 -o postgres -g postgres /run/postgresql
          sudo install -d -m755 -o postgres -g postgres /var/lib/postgresql/16/main
      - name: Configure PostgreSQL
        run: |
          sudo -u postgres tee /etc/postgresql/16/main/pg_hba.conf <<EOF
          local  all  all                trust
          host   all  all  127.0.0.1/32  trust
          EOF
          sudo -u postgres tee /etc/postgresql/16/main/postgresql.conf <<EOF
          data_directory = '/var/lib/postgresql/16/main'
          external_pid_file = '/run/postgresql/16-main.pid'
          fsync = off
          max_wal_senders = 0
          synchronous_commit = off
          wal_level = minimal
          EOF
      - name: Initialize PostgreSQL
        run: sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl init -D /var/lib/postgresql/16/main
      - name: Start PostgreSQL
        run: |
          if ! sudo systemctl start postgresql@16-main.service; then
            sudo systemctl cat postgresql@.service
            ls -la /etc/postgresql/
            ls -la /run/postgresql/
            sudo systemctl status postgresql@16-main.service
          fi
      - name: Set libpq environment variables
        run: echo PGPORT=5432 >>$GITHUB_ENV
      - name: Create the database user
        run: sudo -E -u postgres createuser --superuser $(whoami)
      - name: Create the test database
        run: createdb liberapay_tests
      - name: Create the test database schema
        run: DATABASE_URL=liberapay_tests ./recreate-schema.sh test
      - name: Install Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Cache the .tox directory to speed things up
        uses: actions/cache@v3
        with:
          path: .tox
          key: test-${{ runner.os }}-${{ hashFiles('requirements_*.txt') }}
      - name: Enable expensive tests, on the master branch only
        if: ${{ env.GITHUB_HEAD_REF == 'master' }}
        run: |
          echo LIBERAPAY_I18N_TEST=yes >> $GITHUB_ENV
          echo VCR=off >> $GITHUB_ENV
      - name: Install tox
        run: pip install tox
      - name: Write liberapay environment file for tests
        run: |
          cat >tests/local.env <<EOF
          DATABASE_URL="port=5432 dbname=liberapay_tests"
          # As of March 2025, GitHub Actions runners still don't have IPv6,
          # so we override the default IPv6-only test email address here.
          TEST_EMAIL_ADDRESS=test@changaco.net
          EOF
      - name: Run the tests
        run: tox
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
